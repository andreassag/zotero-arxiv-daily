# ==============================================================================
# golangci-lint configuration (v2 schema)
# ==============================================================================

version: "2"

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        text: "Error return value of.*Close.*is not checked"
      - linters:
          - gosec
        text: "(?:G703|G304)"
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
