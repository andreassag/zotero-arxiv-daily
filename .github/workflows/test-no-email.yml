name: Test (No Email)

on:
  workflow_dispatch:

jobs:
  calculate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run script (no email)
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          NO_EMAIL: "true"
          SAVE_EMAIL_PATH: "email_output.html"
          DEBUG: "true"
        run: |
          export DEBUG=true
          cp config/config.yaml config/base.yaml
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
            echo "Use custom config: "
            cat config/custom.yaml
          fi
          go run go/cmd/zotero-arxiv-daily/main.go -config config

      - name: Upload email output as artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: email-output
          path: email_output.html
          retention-days: 7

      - name: Upload embedding input data as artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: embedding-input-data
          path: outputs/embedding_input_*.json
          retention-days: 7