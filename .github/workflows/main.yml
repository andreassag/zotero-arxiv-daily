name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 07 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.SENDER_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER || secrets.SENDER }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER || secrets.RECEIVER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.OPENAI_API_BASE || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-2.5-flash' }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL || secrets.LLM_BASE_URL || secrets.OPENAI_API_BASE || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'gemini-embedding-2' }}
          DEBUG: ${{ vars.DEBUG || 'false' }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          cp config/config.yaml config/base.yaml
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
            echo "Use custom config: "
            cat config/custom.yaml
          fi
          go run go/cmd/zotero-arxiv-daily/main.go -config config
