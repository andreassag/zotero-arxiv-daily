zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null
  ignore_path: null

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: ${oc.env:SMPT_SERVER}
  smtp_port: 587
  smtp_user: ${oc.env:SMTP_USER,null}
  sender_password: ${oc.env:SENDER_PASSWORD}

source:
  arxiv:
    category: ["q-bio.CB"]
    include_cross_list: false
  biorxiv:
    category: ["bioengineering", "bioinformatics", "genomics", "microbiology", "molecular biology", "synthetic biology"]

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  generation_kwargs:
    model: "Qwen/Qwen3-8B"

screener:
  key: ${oc.env:OPENAI_API_KEY}
  base_url: ${oc.env:OPENAI_API_BASE}
  model: Qwen/Qwen3-Embedding-8B
  batch_size: 64
  screen_top_k: 50
  knn_k: 3
  half_life_days: 180

reranker:
  enabled: true
  key: ${oc.env:OPENAI_API_KEY}
  base_url: ${oc.env:OPENAI_API_BASE}
  model: Qwen/Qwen3-Reranker-8B
  blend_weight: 0.7
  research_interest: null

executor:
  debug: ${oc.env:DEBUG,null}
  max_paper_num: 10

