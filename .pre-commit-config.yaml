# ==============================================================================
# pre-commit framework configuration (optional, for developers using pre-commit)
# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg
# ==============================================================================

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe] # Support custom yaml tags like ${oc.env:...}
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: detect-private-key

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint
        args: [--config=.golangci.yml]

  - repo: local
    hooks:
      - id: check-commit-msg
        name: Check Commit Message (Conventional Commits)
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
